<title>Data Vault AI Landing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: navy call-timeline hero with a moving playhead → Lead Search → product tour →
   before/after Monday → ask your calls (navy) → roles → FAQ + demo. React components, Motion for movement. */
:root {
  --violet: #4434dd; --violet-2: #8076ee; --violet-ink: #c9c4ff; --violet-soft: #efeffe;
  --navy: #2b3674; --navy-deep: #1f2858;
  --slate: #5d6a9a; --slate-soft: #707eae;
  --ground: #f4f7fe; --surface: #ffffff; --tint: #eff3fc;
  --line: #e9edf7; --line-2: #e0e4f2;
  --on-navy: #c3c9e6; --on-navy-line: #ffffff24;
  --pos: #8cca81; --neu: #f5a623; --neg: #f86565;
  --ok-bg: #ecfdf5; --ok-fg: #047857; --warn-bg: #fffbeb; --warn-fg: #b45309;
  --bad-bg: #fff1f2; --bad-fg: #9f1239; --info-bg: #f5f3ff; --info-fg: #6d28d9;
  --sans: Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --r-lg: 8px; --r-xl: 12px; --r-bg: 16px; --r-3xl: 24px;
  --shadow-card: 1px 1px 3px 0 #0000000d, -1px -1px 20px 0 #0000000d;
  --shadow-primary: 0 20px 48px 0 #7090b01f;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--ground); color: var(--navy); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 6px; }
.on-dark :focus-visible { outline-color: #fff; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font: 600 12px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--violet); }
.on-dark .eyebrow { color: var(--violet-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: var(--r-lg); font: 600 15px/1 var(--sans); text-decoration: none; border: 0; cursor: pointer; white-space: nowrap; transition: opacity .15s, transform .2s var(--ease), background-color .15s, box-shadow .2s; }
.btn svg { width: 18px; height: 18px; transition: transform .2s var(--ease); }
.btn:hover svg { transform: translateX(3px); }
.btn-hero { color: #fff; background: linear-gradient(90deg, var(--violet), var(--violet-2)); box-shadow: 0 10px 30px -10px #8076eecc; }
.btn-hero:hover { transform: translateY(-1px); box-shadow: 0 14px 34px -10px #8076eeee; }
.btn-hero:active { transform: scale(.95); }
.btn-line { color: #fff; background: transparent; border: 1px solid #ffffff4d; }
.btn-line:hover { background: #ffffff14; }
.btn-primary { color: #fff; background: var(--violet); }
.btn-primary:hover { opacity: .9; }

/* Progress + nav */
.progress { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; z-index: 30; background: linear-gradient(90deg, var(--violet), var(--violet-2)); transform-origin: 0 50%; transform: scaleX(0); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy-deep); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--navy-deep) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--on-navy-line); color: #fff; }
.top .wrap { display: flex; align-items: center; gap: 20px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--sans); text-decoration: none; color: #fff; }
.brand svg { width: 24px; height: 28px; }
.top nav { display: flex; gap: 2px; margin-left: auto; }
.top nav a { padding: 8px 12px; border-radius: 999px; text-decoration: none; font: 500 14px/20px var(--sans); color: var(--on-navy); transition: background-color .15s, color .15s; }
.top nav a:hover { color: #fff; background: #ffffff14; }
.signin { font: 600 14px/1 var(--sans); color: #fff; text-decoration: none; padding: 10px 14px; border-radius: var(--r-lg); border: 1px solid #ffffff4d; }
.signin:hover { background: #ffffff14; }

/* Hero */
.hero { position: relative; overflow: hidden; background: var(--navy-deep); color: #fff; }
.glow { position: absolute; left: 50%; bottom: -380px; width: 1100px; height: 560px; transform: translateX(-50%); background: radial-gradient(closest-side, #4434dd73, transparent); pointer-events: none; }
.hero .wrap { position: relative; z-index: 1; padding-block: 72px 0; }
.hero-top { display: grid; grid-template-columns: 1.35fr 1fr; gap: 48px; align-items: end; }
.hero h1 { font: 800 clamp(40px, 6vw, 72px)/1 var(--sans); letter-spacing: -.04em; }
.hero h1 .w { display: inline-block; }
.hero h1 .hl { color: var(--violet-ink); }
.hero-side { display: flex; flex-direction: column; gap: 22px; padding-bottom: 6px; }
.hero-side p { font-size: 18px; line-height: 1.6; color: var(--on-navy); }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }

.timeline { margin-top: 56px; background: #ffffff0a; border: 1px solid var(--on-navy-line); border-bottom: 0; border-radius: var(--r-3xl) var(--r-3xl) 0 0; padding: 20px 24px 0; }
.tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font: 500 13px/18px var(--sans); color: var(--on-navy); }
.tl-head b { color: #fff; font-weight: 600; }
.rec { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--mono); color: #fecdd3; background: #e11d4833; padding: 6px 10px; border-radius: 999px; }
.rec i { width: 7px; height: 7px; border-radius: 50%; background: #fb7185; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.tl-head .hint { margin-left: auto; font: 500 12px/16px var(--mono); }
.scrub { position: relative; height: 96px; margin-top: 18px; }
.bars { position: absolute; inset: 20px 0 16px; display: flex; align-items: center; gap: 3px; }
.bars span { flex: 1; min-width: 1px; border-radius: 2px; background: #ffffff2e; transform-origin: 50% 50%; }
.bars span.on { background: var(--violet-2); }
.playhead { position: absolute; top: 14px; bottom: 10px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 12px #c9c4ff; left: 0; pointer-events: none; }
.marker { position: absolute; top: 0; bottom: 0; width: 44px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; color: #fff; }
.marker::before { content: ""; width: 2px; flex: 1; background: #ffffff40; }
.marker span { order: -1; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--mono); background: var(--navy); border: 2px solid #ffffff59; transition: background-color .2s, border-color .2s, transform .3s var(--ease); }
.marker:hover span { transform: scale(1.12); }
.marker[aria-selected="true"] span { background: var(--violet); border-color: #fff; transform: scale(1.15); box-shadow: 0 0 0 6px #4434dd55; }
.tl-times { display: flex; justify-content: space-between; font: 500 11px/16px var(--mono); color: var(--on-navy); padding-bottom: 6px; }
.moment { display: grid; grid-template-columns: 1.3fr 1fr; margin: 14px -24px 0; background: var(--surface); color: var(--navy); border-radius: var(--r-3xl) var(--r-3xl) 0 0; min-height: 184px; }
.quote { padding: 26px 28px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); min-width: 0; }
.quote .who { font: 600 12px/16px var(--mono); color: var(--slate); }
.quote blockquote { margin: 0; font: 500 clamp(19px, 2.2vw, 24px)/1.35 var(--sans); letter-spacing: -.01em; }
.insight { padding: 26px 28px; display: flex; flex-direction: column; gap: 12px; background: #fafbff; border-radius: 0 var(--r-3xl) 0 0; min-width: 0; }
.insight small { font: 600 11px/16px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--slate); }
.insight strong { font: 700 18px/24px var(--sans); }
.insight p { font-size: 14px; line-height: 21px; color: var(--slate); }

/* Shared bits */
.tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 600 12px/18px var(--sans); }
.tag.pos { background: var(--ok-bg); color: var(--ok-fg); } .tag.neg { background: var(--bad-bg); color: var(--bad-fg); }
.tag.info { background: var(--info-bg); color: var(--info-fg); } .tag.hot { background: var(--bad-bg); color: var(--bad-fg); }
.prio { font: 700 10px/14px var(--sans); padding: 3px 8px; border-radius: 999px; }
.prio.hot { background: var(--bad-bg); color: var(--bad-fg); } .prio.warm { background: var(--warn-bg); color: var(--warn-fg); } .prio.cold { background: var(--tint); color: var(--navy); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topic { font: 600 12px/16px var(--sans); padding: 4px 10px; border-radius: 999px; background: var(--info-bg); color: var(--info-fg); }
.sample { font: 500 12px/16px var(--sans); color: var(--slate); margin-top: 12px; }
.on-dark .sample { color: var(--on-navy); }

section { padding-block: 104px; }
.white { background: var(--surface); }
.head { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 48px; align-items: end; margin-bottom: 40px; }
.head > div { display: flex; flex-direction: column; gap: 12px; }
.head h2 { font: 700 clamp(30px, 3.8vw, 46px)/1.06 var(--sans); letter-spacing: -.03em; }
.head p { font-size: 17px; line-height: 1.6; color: var(--slate); max-width: 34em; }
.on-dark .head p { color: var(--on-navy); }

/* Search */
.search { background: var(--surface); border-radius: var(--r-3xl); box-shadow: var(--shadow-primary), 0 0 0 1px var(--line); overflow: hidden; }
.search-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px 14px 22px; border-bottom: 1px solid var(--line); transition: box-shadow .2s; }
.search-bar > svg { width: 22px; height: 22px; color: var(--violet); flex: none; }
.search-bar input { flex: 1; min-width: 0; border: 0; outline: 0; font: 500 clamp(17px, 2vw, 22px)/1.3 var(--sans); color: var(--navy); background: transparent; padding: 8px 0; }
.search-bar input::placeholder { color: var(--slate-soft); }
.search-bar:focus-within { box-shadow: inset 0 -2px 0 var(--violet); }
.caret { width: 2px; height: 26px; background: var(--violet); animation: blink 1s steps(1) infinite; flex: none; margin-left: -10px; }
@keyframes blink { 50% { opacity: 0; } }
.kbd { font: 500 12px/1 var(--mono); color: var(--slate); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--ground); flex: none; }
.suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 22px; background: #fafbff; border-bottom: 1px solid var(--line); }
.suggest > span { font: 600 11px/16px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--slate); margin-right: 4px; }
.chip { font: 500 13px/18px var(--sans); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--navy); cursor: pointer; transition: background-color .15s, border-color .15s, color .15s, transform .2s var(--ease); }
.chip:hover { border-color: var(--violet-2); transform: translateY(-1px); }
.chip[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: #fff; }
.results { display: grid; grid-template-columns: 340px 1fr; min-height: 320px; }
.list { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.list .meta { font: 500 12px/16px var(--mono); color: var(--slate); padding: 6px 10px 8px; }
.hit { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: var(--r-xl); border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--navy); width: 100%; font: inherit; transition: background-color .15s; }
.hit:hover { background: var(--ground); }
.hit[aria-selected="true"] { background: var(--violet-soft); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); font: 700 12px/1 var(--sans); color: var(--violet); }
.hit > div { min-width: 0; }
.hit b { display: block; font: 600 14px/20px var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit small { display: block; font-size: 12px; line-height: 16px; color: var(--slate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail { padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.d-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.d-head h3 { font: 700 22px/28px var(--sans); }
.d-head .ids { font: 500 12px/16px var(--mono); color: var(--slate); width: 100%; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.fact { background: var(--ground); border-radius: var(--r-xl); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fact small { font: 600 10px/14px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--slate); }
.fact b { font: 700 15px/20px var(--sans); display: flex; align-items: center; gap: 6px; }
.summary { font-size: 15px; line-height: 23px; }
.summary mark { background: #fff3c4; color: inherit; padding: 0 2px; border-radius: 3px; }
.nextstep { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-xl); background: var(--navy); color: #fff; font-size: 14px; line-height: 20px; margin-top: auto; }
.nextstep svg { width: 18px; height: 18px; flex: none; color: var(--violet-ink); }
.empty { grid-column: 1 / -1; padding: 40px 26px; color: var(--slate); font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.empty b { color: var(--navy); font-size: 16px; }

/* Tour */
.tabs { position: relative; display: flex; gap: 6px; padding: 6px; background: var(--surface); border-radius: var(--r-bg); box-shadow: var(--shadow-card); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-ind { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: var(--r-xl); background: var(--navy); z-index: 0; }
.tab { position: relative; z-index: 1; flex: 1 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border-radius: var(--r-xl); border: 0; background: transparent; cursor: pointer; text-align: left; color: var(--navy); transition: color .25s; }
.tab:not([aria-selected="true"]):hover { background: var(--ground); }
.tab b { font: 600 15px/20px var(--sans); }
.tab .sub { font: 400 13px/18px var(--sans); color: var(--slate); transition: color .25s; }
.tab[aria-selected="true"] { color: #fff; }
.tab[aria-selected="true"] .sub { color: var(--on-navy); }
.tab .bar { display: block; height: 2px; width: 100%; margin-top: 8px; border-radius: 2px; overflow: hidden; }
.tab[aria-selected="true"] .bar { background: #ffffff33; }
.tab .bar i { display: block; height: 100%; width: 0; background: #fff; }
.window { margin-top: 16px; background: var(--surface); border-radius: var(--r-bg); box-shadow: var(--shadow-primary), 0 0 0 1px var(--line); overflow: hidden; display: grid; grid-template-columns: 64px 1fr; min-height: 450px; }
.rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 0; }
.rail i { width: 36px; height: 36px; border-radius: 999px; background: var(--ground); display: block; transition: background-color .3s; }
.rail i.on { background: var(--violet); }
.pane { background: var(--ground); padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pane-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pane-title h3 { font: 600 22px/28px var(--sans); }
.pill { font: 500 12px/16px var(--mono); padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); color: var(--slate); }
.pane-title .pill:first-of-type { margin-left: auto; }
.grid { display: grid; gap: 16px; }
.g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: 1.4fr 1fr; }
.card { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h4 { font: 700 15px/22px var(--sans); }
.card small { font: 600 11px/16px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--slate); }
.stat { font: 600 34px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.delta { font: 600 12px/16px var(--sans); }
.delta.up { color: var(--ok-fg); } .delta.down { color: var(--bad-fg); }
.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font: 600 11px/16px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--slate); padding: 0 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.donut { display: flex; align-items: center; gap: 18px; }
.donut svg { width: 112px; height: 112px; flex: none; transform: rotate(-90deg); }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel div { display: grid; grid-template-columns: 76px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.funnel div i { display: block; height: 26px; border-radius: 6px; background: var(--violet); transform-origin: 0 50%; }
.funnel div b { text-align: right; font-variant-numeric: tabular-nums; }
.wa-phone { background: #f0f5ef; border-radius: var(--r-xl); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.wa-b { align-self: flex-start; max-width: 90%; background: #fff; padding: 9px 12px; border-radius: 4px 12px 12px 12px; font-size: 13px; line-height: 18px; box-shadow: 0 1px 1px #0000000f; }
.wa-b.me { align-self: flex-end; background: #d9fdd3; border-radius: 12px 4px 12px 12px; }
.wa-meta { display: flex; align-items: center; gap: 6px; font: 600 12px/16px var(--sans); color: var(--slate); }
.wa-meta svg { width: 16px; height: 16px; }

/* Monday */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.ba > div { border-radius: var(--r-3xl); padding: 32px; display: flex; flex-direction: column; gap: 18px; }
.before { background: var(--surface); border: 1px dashed #cbd5e0; }
.after { background: var(--navy); color: #fff; box-shadow: 0 30px 60px -30px #2b3674aa; }
.ba h3 { font: 700 22px/28px var(--sans); }
.ba .label { font: 600 12px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.before .label { color: var(--slate); } .after .label { color: var(--violet-ink); }
.ba ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.ba li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 22px; }
.after li { border-top-color: var(--on-navy-line); }
.ba li time { font: 500 13px/22px var(--mono); }
.before li time, .before li span { color: var(--slate); }
.after li time { color: var(--violet-ink); }
.total { display: flex; align-items: baseline; gap: 10px; padding-top: 6px; }
.total b { font: 700 40px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.total span { font-size: 14px; }
.before .total span { color: var(--slate); } .after .total span { color: var(--on-navy); }

/* Ask */
.ask-sec { background: var(--navy); color: #fff; position: relative; overflow: hidden; }
.ask { display: grid; grid-template-columns: .9fr 1.1fr; gap: 32px; align-items: start; }
.questions { display: flex; flex-direction: column; gap: 10px; }
.q { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; padding: 14px 16px; border-radius: var(--r-xl); border: 1px solid #ffffff26; background: #ffffff0d; color: #fff; font: 500 15px/22px var(--sans); transition: background-color .15s, border-color .15s, transform .2s var(--ease); }
.q:hover { background: #ffffff1a; transform: translateX(4px); }
.q[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; transform: none; }
.q svg { width: 18px; height: 18px; flex: none; opacity: .7; }

  ];
  function Ask() {
    const [i, setI] = useState(1);
    const [thinking, setThinking] = useState(false);
    const ansRef = useRef(null), first = useRef(true);
    useEffect(() => {
      if (first.current) { first.current = false; return; }
      if (!canMove) return;
      setThinking(true);
      const t = setTimeout(() => setThinking(false), 700);
      return () => clearTimeout(t);
    }, [i]);
    useEffect(() => { if (!thinking && ansRef.current) enter(ansRef.current.children, { stagger: .09, y: 10 }); }, [thinking, i]);
    const a = ANSWERS[i];
    return html`
      <div class="ask">
        <div data-reveal>
          <div class="questions" role="group" aria-label="Sample questions">
            ${ANSWERS.map((x, j) => html`<button key=${j} class="q" type="button" aria-pressed=${i === j} onClick=${() => setI(j)}><${Icon} id="i-msg" />${x.q}</button>`)}
          </div>
          <p class="sample">Sample answers from demo data.</p>
        </div>
        <div class="chat" aria-live="polite" data-reveal>
          <div class="chat-top">Data Vault Chat<div class="ctx"><span>Project: Electronics</span><span>Last 7 days</span></div></div>
          <div class="msg-user" key=${'q' + i}>${a.q}</div>
          ${thinking ? html`<span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span>` : html`
            <div class="msg-ai" ref=${ansRef}>
              <div class="ans-num">${a.big}</div><p>${a.lead}</p>
              <ul>${a.items.map(t => html`<li key=${t}>${t}</li>`)}</ul>
              <span class="src">${a.src}</span>
            </div>`}
        </div>
      </div>`;
  }

  /* ───────────── Roles ───────────── */
  const SEATS = [
    { role: 'Team lead', sub: 'Coach agents and chase hot leads', title: 'Know which calls need you before stand-up.',
      points: ['Daily Snapshot shows sentiment and top issues for every call', 'Hot leads arrive with a suggested next step', 'Open the exact moment a deal went wrong'],
      route: 'Daily Snapshot · Lead Management · Agent Calls',
      mini: () => html`
        <div class="card m"><small>Today’s calls</small><div class="row"><span class="big" data-count>1,284</span><span class="prio hot">57 HOT</span></div></div>
        <div class="card m"><small>Needs your attention</small>
          <div class="row"><b>Imran Shaikh</b><span style=${{ color: 'var(--bad-fg)', fontWeight: 600 }}>Sentiment ↓</span></div>
          <div class="row"><b>Sneha Rao</b><span>Callback 6 pm</span></div>
          <div class="row"><b>Rohan Kapoor</b><span>Offer by Fri</span></div></div>` },
    { role: 'Admin', sub: 'Run projects, products and access', title: 'See every project, product and campaign in one place.',
      points: ['Compare projects and products on enquiries and sentiment', 'Control who sees which project', 'Track WhatsApp campaign delivery, reads and replies'],
      route: 'Performance Report · Product Insights · Retargeting',
      mini: () => html`
        <div class="card m"><small>Positive sentiment by project</small>
          ${[['Electronics', 68, 'var(--violet)'], ['Home appliances', 61, 'var(--violet-2)'], ['Kitchen', 54, '#975cd7']].map(([n, v, c]) => html`
            <div key=${n} style=${{ display: 'flex', flexDirection: 'column', gap: '6px' }}><div class="row"><span>${n}</span><b class="num" data-count>${v}%</b></div><div class="track"><i class="grow" style=${{ width: v + '%', background: c }}></i></div></div>`)}
        </div>
        <div class="two"><div class="card m"><small>Campaigns live</small><span class="big" data-count>6</span></div><div class="card m"><small>Reply rate</small><span class="big" data-count>29%</span></div></div>` },
    { role: 'Sales agent', sub: 'Prepare for the next call', title: 'Walk into every callback knowing the last conversation.',
      points: ['Search any lead by name, phone or ID', 'Read a two-line summary instead of replaying the call', 'See the objection to handle and the offer to make'],
      route: 'Lead Search · Data Vault',
      mini: () => html`
        <div class="card m"><small>Before you call Rohan</small><p style=${{ fontSize: '14px', lineHeight: '20px' }}>Online price was lower than your quote. Offer free installation and the 5-year warranty.</p><div class="topics"><span class="topic">Price objection</span><span class="topic">Warranty</span></div></div>
        <div class="card m"><div class="row"><b style=${{ display: 'flex', alignItems: 'center', gap: '8px' }}><svg width="16" height="16" aria-hidden="true"><use href="#i-wa" /></svg>Last message</b><span>Read 10:42</span></div></div>` }
  ];
  function Seats() {
    const [i, setI] = useState(0);
    const viewRef = useRef(null);
    useEffect(() => {
      const v = viewRef.current; if (!v || !canMove) return;
      enter(v.querySelectorAll('.seat-copy > *, .seat-copy li'), { stagger: .05, y: 10 });
      enter(v.querySelectorAll('.m'), { stagger: .1, y: 16, start: .1 });
      M.animate(v.querySelectorAll('.grow'), { scaleX: [0, 1] }, { duration: .8, delay: M.stagger(.1, { startDelay: .2 }), ease: EASE });
      countUp(v);
    }, [i]);
    const onKey = (e, j) => {
      if (!['ArrowDown', 'ArrowUp', 'ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      e.preventDefault();
      const k = (j + (e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1) + SEATS.length) % SEATS.length;
      setI(k); document.getElementById('seat-' + k).focus();
    };
    const s = SEATS[i];
    return html`
      <div class="seats" data-reveal>
        <div class="seat-list" role="tablist" aria-label="Roles">
          ${SEATS.map((x, j) => html`<button key=${x.role} id=${'seat-' + j} class="seat" type="button" role="tab" aria-selected=${i === j} tabIndex=${i === j ? 0 : -1}
            onClick=${() => setI(j)} onKeyDown=${e => onKey(e, j)}><b>${x.role}</b><span>${x.sub}</span></button>`)}
        </div>
        <div class="seat-view" role="tabpanel" aria-labelledby=${'seat-' + i} ref=${viewRef} key=${i}>
          <div class="seat-copy"><span class="eyebrow">${s.role}</span><h3>${s.title}</h3>
            <ul>${s.points.map(p => html`<li key=${p}><${Icon} id="i-check" /><span>${p}</span></li>`)}</ul>
            <span class="route">${s.route}</span></div>
          <div class="mini">${s.mini()}</div>
        </div>
      </div>`;
  }

  /* ───────────── FAQ + demo form ───────────── */
  function Close() {
    const [msg, setMsg] = useState({ cls: '', text: 'We reply within one business day.' });
    const nameRef = useRef(null), emailRef = useRef(null);
    const submit = e => {
      e.preventDefault();
      if (!nameRef.current.value.trim()) { setMsg({ cls: 'err', text: 'Enter your name.' }); nameRef.current.focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailRef.current.value.trim())) { setMsg({ cls: 'err', text: 'Enter a work email like you@company.com.' }); emailRef.current.focus(); return; }
      setMsg({ cls: 'ok', text: 'Looks good. This preview doesn’t send requests yet; connect the form to your sales inbox.' });
    };
    const faqs = [
      ['Do agents need to change how they call?', 'No. Data Vault works on the recordings your telephony already produces.'],
      ['How is a lead marked hot, warm or cold?', 'The AI weighs buying intent, urgency, objections and sentiment across a customer’s calls. Each rating links to the calls behind it.'],
      ['Who can see which calls?', 'Admins see everything, team leads see their projects, and each project’s data stays separate.'],
      ['Can we send campaigns from Data Vault?', 'Yes. Build a retargeting list from your leads, send it on WhatsApp and track reads and replies.']
    ];
    return html`
      <div class="wrap close">
        <div data-reveal>
          <div class="head" style=${{ gridTemplateColumns: '1fr', marginBottom: '24px' }}><div><span class="eyebrow">FAQ</span><h2>Before you book</h2></div></div>
          <div class="faq">${faqs.map(([q, a], j) => html`<details key=${q} open=${j === 0}><summary>${q}</summary><p>${a}</p></details>`)}</div>
        </div>
        <div class="demo-card" id="demo" data-reveal>
          <span class="eyebrow">Book a demo</span>
          <h2>Bring three recordings. We’ll analyse them live.</h2>
          <p>In 30 minutes you’ll see the sentiment, lead ranking and follow-ups Data Vault finds in your own calls.</p>
          <form class="form" noValidate onSubmit=${submit}>
            <div class="row2">
              <div class="field"><label htmlFor="name">Name</label><input id="name" ref=${nameRef} autoComplete="name" /></div>
              <div class="field"><label htmlFor="email">Work email</label><input id="email" ref=${emailRef} type="email" autoComplete="email" placeholder="you@company.com" /></div>
            </div>
            <div class="field"><label htmlFor="size">Sales team size</label>
              <select id="size" defaultValue="11–50 agents"><option>1–10 agents</option><option>11–50 agents</option><option>51–200 agents</option><option>200+ agents</option></select></div>
            <button class="btn btn-primary" type="submit">Request demo</button>
            <p class=${'fmsg ' + msg.cls} role="status">${msg.text}</p>
          </form>
        </div>
      </div>`;
  }

  const Head = ({ eyebrow, title, text }) => html`<div class="head" data-reveal><div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2></div><p>${text}</p></div>`;

  function App() {
    useEffect(() => {
      if (!canMove) return;
      M.scroll(M.animate('.progress', { scaleX: [0, 1] }, { ease: 'linear' }));
      // Sections slide up as they enter; they render fully visible before this runs
      M.inView('[data-reveal]', el => { M.animate(el, { opacity: [0, 1], y: [36, 0] }, { duration: .8, ease: EASE }); }, { amount: .15 });
    }, []);
    return html`
      <header class="top on-dark">
        <div class="wrap">
          <a class="brand" href="#top" aria-label="Data Vault AI home"><svg aria-hidden="true" fill="#c9c4ff"><use href="#logo" /></svg>Data Vault AI</a>
          <nav aria-label="Sections"><a href="#top-calls">Top calls</a><a href="#modules">Modules</a><a href="#tour">Product tour</a><a href="#ask">Ask your calls</a></nav>
          <a class="signin" href="#signin">Sign in</a>
        </div>
      </header>
      <main>
        <${Hero} />
        <section class="white" id="top-calls"><div class="wrap">
          <${Head} eyebrow="Top Calls Analysis" title="Your best and worst calls of the week, ranked." text="Every call gets a pitch score. Open any call to hear it and see exactly why it ranked where it did." />
          <${TopCalls} />
          <p class="sample">Sample calls and scores.</p>
        </div></section>
        <section id="modules"><div class="wrap">
          <${Head} eyebrow="Modules" title="Data Vault + and every module your sales floor needs." text="One login, nine modules. Each one answers a question your team asks every day. Pick one to see it in the tour." />
          <${Modules} />
        </div></section>
        <section class="white" id="search"><div class="wrap">
          <${Head} eyebrow="Lead Search" title="Find any customer’s calls in seconds." text="Type a name, phone number, lead ID or a problem like “EMI”. Every result comes with the AI summary and a next step." />
          <${SearchDemo} />
          <p class="sample">Live demo with sample leads. Try typing “AC”, “Arjun” or “delivery”.</p>
        </div></section>
        <section id="tour"><div class="wrap">
          <${Head} eyebrow="Product tour" title="Five screens your sales floor will open every day." text="Pick a screen to see it with sample data. The tour moves on by itself; hover to pause it." />
          <${Tour} />
        </div></section>
        <section class="white" id="monday"><div class="wrap">
          <${Head} eyebrow="Why teams switch" title="A team lead’s Monday, before and after." text="Reviewing last week’s calls used to take most of the morning. With Data Vault, it’s the first ten minutes." />
          <${Monday} />
        </div></section>
        <section class="ask-sec on-dark" id="ask"><div class="wrap">
          <${Head} eyebrow="Ask your calls" title="Ask a question. Get the answer from every call you’ve recorded." text="No dashboards to configure. Data Vault knows your project, products and date range, and points to the calls behind each answer." />
          <${Ask} />
        </div></section>
        <section id="roles"><div class="wrap">
          <${Head} eyebrow="For your team" title="Each seat opens to the answer it needs." text="Team leads, admins and agents look at the same calls with different questions. Pick a role." />
          <${Seats} />
        </div></section>
        <section class="white" id="faq"><${Close} /></section>
      </main>
      <footer id="signin"><div class="wrap"><span>© 2026 V-Retail · Data Vault AI</span>
        <nav aria-label="Footer"><a href="#tour">Product tour</a><a href="#faq">FAQ</a><a href="#demo">Contact sales</a></nav></div></footer>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
