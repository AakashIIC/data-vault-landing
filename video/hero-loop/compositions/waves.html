<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      --navy: #1f2858;
      --navy-edge: #161d45;
    }
    #waves-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 75% 85% at 55% 55%,
        var(--navy) 0%,
        var(--navy) 35%,
        var(--navy-edge) 100%
      );
    }
    #waves-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div id="root" data-composition-id="waves" data-width="1920" data-height="1080">
    <div id="waves-bg" class="clip" data-start="0" data-duration="8" data-layout-ignore></div>
    <canvas
      id="waves-canvas"
      class="clip"
      width="1920"
      height="1080"
      data-start="0"
      data-duration="8"
      data-layout-ignore
    ></canvas>
  </div>
  <script>
    (function () {
      // Every motion below is a function of phase = t / LOOP with integer
      // frequencies, so t = 8 equals t = 0 and the clip loops seamlessly.
      const LOOP = 8;
      const W = 1920;
      const H = 1080;
      const TAU = Math.PI * 2;

      const VIOLET_DEEP = [68, 52, 221]; // #4434dd
      const VIOLET_LIGHT = [128, 118, 238]; // #8076ee
      const GLOW = [201, 196, 255]; // #c9c4ff

      const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
      const smooth = (e0, e1, x) => {
        const k = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
        return k * k * (3 - 2 * k);
      };

      // Seeded PRNG (mulberry32): same layout on every render.
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = rng(20261028);

      // ---- Waveform bars -------------------------------------------------
      const BAR_COUNT = 84;
      const BAND_LEFT = 0.03 * W;
      const BAND_RIGHT = 0.97 * W;
      const BAND_Y = 0.665 * H; // centre line, below the headline area
      const BAR_W = 9;
      const MAX_HALF = 118;
      const step = (BAND_RIGHT - BAND_LEFT) / (BAR_COUNT - 1);
      const bars = Array.from({ length: BAR_COUNT }, (_, i) => ({
        x: BAND_LEFT + i * step,
        u: i / (BAR_COUNT - 1),
        p1: rand() * TAU,
        p2: rand() * TAU,
        p3: rand() * TAU,
        jitter: 0.55 + rand() * 0.45,
      }));

      // ---- Particles that become insight chips ---------------------------
      const PARTICLE_COUNT = 11;
      const particles = Array.from({ length: PARTICLE_COUNT }, (_, i) => ({
        offset: i / PARTICLE_COUNT + rand() * 0.04,
        y: 0.53 * H + rand() * 0.33 * H,
        bobAmp: 6 + rand() * 10,
        bobPhase: rand() * TAU,
        chipW: 38 + Math.round(rand() * 26),
        dot: 2.2 + rand() * 1.4,
      }));
      // Travel window: from mid-frame to past the right edge (kept out of the
      // calm top-left area where the headline sits).
      const P_START = 0.42 * W;
      const P_END = 1.04 * W;

      const canvas = document.getElementById("waves-canvas");
      const ctx = canvas.getContext("2d");

      function roundRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function drawBottomGlow(ph) {
        const breath = 0.5 - 0.5 * Math.cos(TAU * ph); // 0 -> 1 -> 0 over the loop
        const radius = 760 + 70 * breath;
        const alpha = 0.36 + 0.09 * breath; // peaks at ~45%
        const cx = W / 2;
        const cy = H + 120;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        g.addColorStop(0, rgba(VIOLET_DEEP, alpha));
        g.addColorStop(0.45, rgba(VIOLET_DEEP, alpha * 0.45));
        g.addColorStop(1, rgba(VIOLET_DEEP, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function barHalfHeight(b, ph) {
        // Speech-like: a slow phrase envelope travelling across the band,
        // syllable pulses, and per-bar flutter. All integer cycles per loop.
        const phrase = 0.5 + 0.5 * Math.sin(TAU * (2 * ph - 1.3 * b.u) + b.p1 * 0.15);
        const syllable = Math.abs(Math.sin(TAU * (5 * ph) + b.u * 9 + b.p2 * 0.3));
        const flutter = 0.5 + 0.5 * Math.sin(TAU * (9 * ph) + b.p3);
        const centre = Math.sin(Math.PI * b.u); // taper at both ends of the band
        const left = 0.38 + 0.62 * smooth(0.05, 0.62, b.u); // quieter under the headline
        const amp = (0.12 + 0.88 * phrase * (0.45 + 0.55 * syllable)) * (0.75 + 0.25 * flutter);
        return 4 + MAX_HALF * amp * b.jitter * Math.pow(centre, 0.7) * left;
      }

      function drawBars(ph) {
        const grad = ctx.createLinearGradient(0, BAND_Y - MAX_HALF, 0, BAND_Y + MAX_HALF);
        grad.addColorStop(0, rgba(VIOLET_LIGHT, 1));
        grad.addColorStop(0.5, rgba(VIOLET_DEEP, 1));
        grad.addColorStop(1, rgba(VIOLET_LIGHT, 1));

        // Pass 1: soft glow; pass 2: crisp bars.
        for (let pass = 0; pass < 2; pass++) {
          ctx.save();
          if (pass === 0) {
            ctx.shadowColor = rgba(GLOW, 0.55);
            ctx.shadowBlur = 26;
            ctx.fillStyle = rgba(GLOW, 0.1);
          } else {
            ctx.fillStyle = grad;
          }
          for (const b of bars) {
            const h = barHalfHeight(b, ph);
            const fade = 0.32 + 0.4 * smooth(0.0, 0.55, b.u); // left side dimmer
            ctx.globalAlpha = pass === 0 ? fade * 0.8 : fade;
            roundRect(b.x - BAR_W / 2, BAND_Y - h, BAR_W, h * 2, BAR_W / 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Faint centre line
        const line = ctx.createLinearGradient(BAND_LEFT, 0, BAND_RIGHT, 0);
        line.addColorStop(0, rgba(GLOW, 0));
        line.addColorStop(0.5, rgba(GLOW, 0.14));
        line.addColorStop(1, rgba(GLOW, 0));
        ctx.fillStyle = line;
        ctx.fillRect(BAND_LEFT, BAND_Y - 0.5, BAND_RIGHT - BAND_LEFT, 1);
      }

      function drawParticles(ph) {
        for (const p of particles) {
          const k = (((ph + p.offset) % 1) + 1) % 1; // 0..1, one pass per loop
          const x = P_START + (P_END - P_START) * k;
          const y = p.y + p.bobAmp * Math.sin(TAU * ph + p.bobPhase);
          const vis = smooth(0, 0.14, k) * (1 - smooth(0.86, 1, k));
          const m = smooth(0.42, 0.68, k); // dot -> chip morph
          if (vis <= 0.001) continue;

          const w = p.dot * 2 + (p.chipW - p.dot * 2) * m;
          const h = p.dot * 2 + (14 - p.dot * 2) * m;

          ctx.save();
          ctx.globalAlpha = vis;
          ctx.shadowColor = rgba(GLOW, 0.5 * (1 - m) + 0.2);
          ctx.shadowBlur = 12;
          ctx.fillStyle = rgba(VIOLET_LIGHT, 0.6 - 0.42 * m);
          roundRect(x - w / 2, y - h / 2, w, h, h / 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          if (m > 0.01) {
            ctx.strokeStyle = rgba(GLOW, 0.26 * m);
            ctx.lineWidth = 1;
            ctx.stroke();
            // abstract chip content: a dot and a short pill, no text
            ctx.globalAlpha = vis * m;
            ctx.fillStyle = rgba(GLOW, 0.45);
            ctx.beginPath();
            ctx.arc(x - w / 2 + 8, y, 2.4, 0, TAU);
            ctx.fill();
            ctx.fillStyle = rgba(GLOW, 0.22);
            roundRect(x - w / 2 + 15, y - 2, Math.max(0, w - 26), 4, 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function renderAt(t) {
        const ph = (((t / LOOP) % 1) + 1) % 1;
        ctx.clearRect(0, 0, W, H);
        drawBottomGlow(ph);
        drawBars(ph);
        drawParticles(ph);
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, {
        t: LOOP,
        duration: LOOP,
        ease: "none",
        onUpdate: () => renderAt(clock.t),
      });
      renderAt(0);
      window.__timelines["waves"] = tl;
    })();
  </script>
</template>
